name: jira-auth-test

# Temporary diagnostic - prints only HTTP status codes, never credentials.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      JIRA_HOST: ${{ secrets.JIRA_HOST }}
      JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
    steps:
      - name: Check Jira auth from runner
        run: |
          echo "host length: ${#JIRA_HOST}, email length: ${#JIRA_EMAIL}, token length: ${#JIRA_API_TOKEN}"
          echo "== /rest/api/2/myself with basic auth:"
          curl -s -o /tmp/myself.json -w '%{http_code}\n' -u "${JIRA_EMAIL}:${JIRA_API_TOKEN}" "https://${JIRA_HOST}/rest/api/2/myself"
          echo "== /rest/api/2/issue/CR-41180 with basic auth:"
          curl -s -o /tmp/issue.json -w '%{http_code}\n' -u "${JIRA_EMAIL}:${JIRA_API_TOKEN}" "https://${JIRA_HOST}/rest/api/2/issue/CR-41180"
          echo "== /rest/api/2/myself with NO auth (WAF test):"
          curl -s -o /tmp/anon.json -w '%{http_code}\n' "https://${JIRA_HOST}/rest/api/2/myself"
          echo "== issue fetch WITHOUT User-Agent header (mimics old node 'request' lib):"
          curl -s -o /tmp/noua.json -w '%{http_code}\n' -H 'User-Agent:' -u "${JIRA_EMAIL}:${JIRA_API_TOKEN}" "https://${JIRA_HOST}/rest/api/2/issue/CR-41180"
          head -c 120 /tmp/noua.json; echo

  # Same request, but issued from the enricher container's own Node 14 runtime.
  # No credentials needed - we only compare anonymous responses:
  # curl-anon got 401 JSON; if this gets 403 CloudFront HTML, the container's
  # TLS fingerprint is what Atlassian blocks.
  test-container-node:
    runs-on: ubuntu-latest
    container:
      image: quay.io/codefreshplugins/argo-hub-workflows-codefresh-csdp-versions-0.0.6-images-image-enricher-jira-info:main
    env:
      JIRA_HOST: ${{ secrets.JIRA_HOST }}
    steps:
      - name: Anonymous request from container Node runtime
        run: |
          node -e "
            console.log('node version:', process.version);
            const https = require('https');
            https.get({ host: process.env.JIRA_HOST, path: '/rest/api/2/myself' }, (res) => {
              console.log('status:', res.statusCode);
              let b = '';
              res.on('data', (c) => b += c);
              res.on('end', () => console.log('body starts:', b.slice(0, 120)));
            }).on('error', (e) => { console.log('error:', e.message); process.exit(1); });
          "

      - name: jira-connector with FAKE creds - unpatched vs patched
        working-directory: /app/
        run: |
          PROBE="
            const JiraClient = require('jira-connector');
            const c = new JiraClient({ host: process.env.JIRA_HOST, basic_auth: { email: 'fake@example.com', api_token: 'fake-token' } });
            c.issue.getIssue({ issueKey: 'CR-41180' })
              .then((r) => console.log('OK:', JSON.stringify(r).slice(0, 150)))
              .catch((e) => console.log('ERR:', String(e).slice(0, 200)));
          "
          echo "== unpatched (expect CloudFront 403 HTML):"
          node -e "$PROBE"
          echo "== patching: strip body from GET requests =="
          sed -i "s|this.makeRequest = function (options, callback, successString) {|this.makeRequest = function (options, callback, successString) { if (options.method === 'GET') { delete options.body; }|" /app/node_modules/jira-connector/index.js
          echo "== patched (expect Jira JSON error, not CloudFront):"
          node -e "$PROBE"
